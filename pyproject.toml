[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet"
version = "0.1.0"
description = "Mamba Selective State Space Models for exoplanet detection in TESS light curves"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "José Fabián Zumbado Ruiz" },
    { name = "Jeremmy Aguilar Villanueva" },
]
keywords = [
    "exoplanets",
    "tess",
    "mamba",
    "state-space-models",
    "deep-learning",
    "astronomy",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Numérico / tabular
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",      # SMOTE para balanceo de clases (Fase 5+)
    # Astronomía
    "astropy>=6.0",
    "lightkurve>=2.4",
    "astroquery>=0.4",             # acceso a MAST y NASA Exoplanet Archive
    "pyvo>=1.5",                   # consultas TAP al TOI Catalog (Fase 1)
    # Deep learning (CPU/CUDA — instalar build CUDA aparte, ver README Paso 4)
    "torch>=2.2",
    "einops>=0.8",                 # operaciones de tensor reutilizadas en Mamba (Fase 8)
    "tensorboard>=2.16",           # logs de entrenamiento (Fase 6)
    # Visualización y utilidades
    "matplotlib>=3.8",
    "seaborn>=0.13",               # curvas ROC/PR y comparaciones (Fases 7/9/10)
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]
# Solo Linux/WSL2 — mamba-ssm no tiene wheels para Windows.
# Instalar con: pip install -e ".[dev,mamba]"
# Pin <2.3 porque 2.3+ requiere triton>=3.5 (solo viene con torch>=2.12).
# Con torch 2.5.1+cu121 (triton 3.1) tenemos que quedarnos en 2.2.x.
mamba = [
    "causal-conv1d>=1.4.0",
    "mamba-ssm>=2.2.0,<2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Los notebooks son exploratorios (EDA, pruebas en Colab): se versiona el código,
# no el estilo. Linterlos sólo produce ruido de semicolons e imports de celda.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# El código científico usa notación matemática que choca con pep8-naming, y
# renombrarla haría el código MENOS legible frente a la fuente que implementa:
#   N806/N803  `X`, `X_train` = matriz de diseño (convención de scikit-learn);
#              `J`, `Z`, `N`, `T` = matrices de DeLong según Sun & Xu (2014);
#              `L` = longitud de secuencia; `flux_L`/`mask_L` = arrays de largo L.
#   E741       `l` = vector de contraste de DeLong, y en los modelos multibranch
#              `g`/`l` = global view / local view (Shallue & Vanderburg, 2018).
"scripts/compute_stats.py" = ["N806", "E741"]
"scripts/train_logreg.py" = ["N806", "N803"]
"scripts/preprocess_global.py" = ["N806"]
"src/exoplanet/data/augment.py" = ["N806"]
"src/exoplanet/models/astronet_multibranch.py" = ["E741"]
"src/exoplanet/models/exomamba_v1.py" = ["E741"]
"agent/eval/metrics.py" = ["N806"]
# Streamlit exige que st.set_page_config() corra antes que cualquier otro import
# que toque st, así que los imports no pueden ir todos arriba.
"agent/app.py" = ["E402"]
# En los CLI operativos las líneas largas son textos de --help y mensajes de log:
# partirlos los vuelve más difíciles de leer y de grepear. El paquete instalable
# (src/) sí se mantiene estricto en 100 columnas.
"scripts/*.py" = ["E501"]
"agent/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
